<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read the complete AI Engineering from Scratch README in your language without leaving the page.">
  <title>README · AI Engineering from Scratch</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--bg); color: var(--ink); }
    .readme-top { position: sticky; top: 0; z-index: 20; background: var(--header-bg); border-bottom: 1px solid var(--rule-soft); backdrop-filter: blur(12px); }
    .readme-top-inner { max-width: 1160px; margin: auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .readme-brand { color: var(--ink); font-family: var(--font-mono); font-size: .8rem; font-weight: 700; letter-spacing: .03em; text-decoration: none; }
    .readme-brand:hover { color: var(--blueprint); }
    .readme-tools { display: flex; align-items: center; gap: 16px; }
    .readme-repo { color: var(--ink-soft); font-family: var(--font-mono); font-size: .72rem; text-decoration: underline; text-underline-offset: 3px; }
    .readme-repo:hover { color: var(--blueprint); }
    .readme-shell { max-width: 1100px; margin: 0 auto; padding: 34px 24px 100px; }
    .readme-intro { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--rule-soft); padding-bottom: 18px; margin-bottom: 18px; }
    .readme-intro h1 { font-family: var(--font-body); font-size: clamp(1.7rem, 3vw, 2.5rem); line-height: 1.15; margin: 0; }
    .readme-status { font-family: var(--font-mono); font-size: .72rem; color: var(--ink-soft); min-height: 1.5em; margin-bottom: 18px; }
    .readme-status[data-kind="error"] { color: #b4472b; }
    .readme-status[data-kind="draft"] { color: var(--warn); }
    .readme-content { overflow-wrap: anywhere; font-family: var(--font-body); font-size: 1.05rem; line-height: 1.66; }
    .readme-content > :first-child { margin-top: 0; }
    .readme-content h1, .readme-content h2, .readme-content h3, .readme-content h4 { font-family: var(--font-body); line-height: 1.22; margin: 1.8em 0 .55em; scroll-margin-top: 86px; }
    .readme-content h1 { font-size: 2.1rem; }
    .readme-content h2 { font-size: 1.65rem; padding-bottom: .25em; border-bottom: 1px solid var(--rule-soft); }
    .readme-content h3 { font-size: 1.3rem; }
    .readme-content p, .readme-content ul, .readme-content ol, .readme-content blockquote, .readme-content pre, .readme-content table { margin: .8em 0 1.1em; }
    .readme-content ul, .readme-content ol { padding-inline-start: 1.6em; }
    .readme-content li { margin: .2em 0; }
    .readme-content a { color: var(--blueprint); text-decoration: underline; text-underline-offset: 3px; }
    .readme-content a:hover { color: var(--accent-hover); }
    .readme-content img { max-width: 100%; height: auto; }
    .readme-content code { font-family: var(--font-mono); font-size: .83em; background: var(--code-bg); padding: .08em .25em; }
    .readme-content pre { overflow-x: auto; background: var(--code-bg); padding: 16px; border: 1px solid var(--rule-soft); }
    .readme-content pre code { font-size: .76rem; padding: 0; background: none; }
    .readme-content blockquote { border-inline-start: 3px solid var(--blueprint); padding: .2em 1em; color: var(--ink-soft); }
    .readme-content table { display: block; width: 100%; overflow-x: auto; border-collapse: collapse; font-size: .88rem; }
    .readme-content th, .readme-content td { padding: 9px 12px; text-align: start; vertical-align: top; border: 1px solid var(--rule-soft); min-width: 130px; }
    .readme-content th { background: var(--bg-surface); font-weight: 700; }
    .readme-content details { border: 1px solid var(--rule-soft); padding: .6em 1em; margin: 1em 0; }
    .readme-content summary { cursor: pointer; font-weight: 700; }
    .readme-content hr { border: 0; border-top: 1px solid var(--rule-soft); margin: 2em 0; }
    @media (max-width: 600px) { .readme-top-inner { padding: 10px 14px; } .readme-brand { max-width: 38vw; line-height: 1.2; } .readme-tools { gap: 9px; } .readme-repo { display: none; } .readme-shell { padding: 24px 14px 70px; } }
  </style>
</head>
<body>
  <header class="readme-top">
    <div class="readme-top-inner">
      <a class="readme-brand" href="https://github.com/MaYangle/ai-engineering-from-scratch">AI Engineering from Scratch</a>
      <div class="readme-tools">
        <a class="readme-repo" href="https://github.com/MaYangle/ai-engineering-from-scratch">GitHub</a>
        <div id="langPicker"></div>
      </div>
    </div>
  </header>
  <main class="readme-shell">
    <div class="readme-intro"><h1>README</h1></div>
    <p class="readme-status" id="readmeStatus" role="status" aria-live="polite"></p>
    <article class="readme-content" id="readmeContent" aria-busy="true"></article>
  </main>
  <script>
    window.AIFS_LANGS = [
      {code:'en',native:'English'}, {code:'es',native:'Español'},
      {code:'fr',native:'Français'}, {code:'pt',native:'Português'},
      {code:'de',native:'Deutsch'}, {code:'it',native:'Italiano'},
      {code:'zh',native:'简体中文'}, {code:'ja',native:'日本語'},
      {code:'ko',native:'한국어'}, {code:'hi',native:'हिन्दी'},
      {code:'ar',native:'العربية'}, {code:'ru',native:'Русский'},
      {code:'tr',native:'Türkçe'}
    ];
  </script>
  <script src="vendor/marked.umd.js"></script>
  <script src="lang-picker.js"></script>
  <script src="readme-reader.js"></script>
</body>
</html>
